[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/run/ingenium-supervisor/supervisor.sock
chmod=0770
chown=root:ingenium-api

[supervisorctl]
serverurl=unix:///run/ingenium-supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:ingenium-api]
user=ingenium-api
command=/app/scripts/run-api.sh
directory=/app/services/ingenium-api
autorestart=unexpected
startsecs=5
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
; Start before the dashboard and OpenCode services.
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:restore-maintenance]
user=ingenium-restore
command=/app/scripts/run-restore-maintenance.sh
directory=/app
autostart=false
autorestart=false
startsecs=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
priority=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:restore-handoff]
user=ingenium-restore
command=/app/scripts/run-restore-handoff.sh
directory=/app
autorestart=unexpected
startsecs=1
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=10
priority=4
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ingenium-dashboard]
user=ingenium-dashboard
command=/app/scripts/run-dashboard.sh
directory=/app/services/ingenium-dashboard
autorestart=unexpected
startsecs=5
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
; Start after the API and before OpenCode services.
priority=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ingenium-api-boundary]
user=ingenium-boundary
command=/app/scripts/run-api-boundary-proxy.sh
directory=/app
autorestart=unexpected
startsecs=3
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=20
; This is the only host-published API listener. It injects the token while
; forwarding to the private Express listener on 127.0.0.1:4096.
priority=12
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ingenium-gateway]
user=ingenium-gateway
command=/app/scripts/run-gateway.sh
directory=/app
autorestart=unexpected
startsecs=3
startretries=5
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stopwaitsecs=20
priority=20
# Nginx writes errors directly to this appuser-owned runtime file. Exposing it
# as stdout keeps errors available through supervisor.readProcessStdoutLog.
stdout_logfile=/run/ingenium-gateway/nginx-error.log
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:opencode-web]
user=ingenium-opencode
command=/app/scripts/start-opencode-web.sh
directory=/workspace
autorestart=unexpected
startsecs=5
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:opencode-internal-proxy]
user=ingenium-opencode
command=/app/scripts/start-opencode-auth-proxy.sh
directory=/app
autorestart=unexpected
startsecs=3
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=20
priority=32
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ttyd-opencode]
user=ingenium-ttyd
command=/app/scripts/start-ttyd.sh
directory=/workspace
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:vscode]
user=ingenium-vscode
command=/app/scripts/start-vscode.sh
directory=/workspace
autorestart=unexpected
startsecs=5
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
priority=35
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
