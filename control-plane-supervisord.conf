[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/run/ingenium-supervisor/supervisor.sock
chmod=0770
chown=root:ingenium-api

[supervisorctl]
serverurl=unix:///run/ingenium-supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:ingenium-api]
user=ingenium-api
command=/app/scripts/run-api.sh
directory=/app/services/ingenium-api
autorestart=unexpected
startsecs=5
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:restore-maintenance]
user=ingenium-restore
command=/app/scripts/run-restore-maintenance.sh
directory=/app
autostart=false
autorestart=false
startsecs=0
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
priority=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:restore-handoff]
user=ingenium-restore
command=/app/scripts/run-restore-handoff.sh
directory=/app
autorestart=unexpected
startsecs=1
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=10
priority=4
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ingenium-dashboard]
user=ingenium-dashboard
command=/app/scripts/run-dashboard.sh
directory=/app/services/ingenium-dashboard
autorestart=unexpected
startsecs=5
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
priority=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ingenium-api-boundary]
user=ingenium-boundary
command=/app/scripts/run-api-boundary-proxy.sh
directory=/app
autorestart=unexpected
startsecs=3
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=20
priority=12
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ingenium-gateway]
user=ingenium-gateway
command=/app/scripts/run-gateway.sh
directory=/app
autorestart=unexpected
startsecs=3
startretries=5
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stopwaitsecs=20
priority=20
stdout_logfile=/run/ingenium-gateway/nginx-error.log
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
