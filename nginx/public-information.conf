# A dedicated loopback origin for Cloudflare's public application-information
# hostname. It has no proxy locations, API access, credentials or user files.
server {
    listen 127.0.0.1:4170;
    server_name _;
    root /app/docs/site;
    access_log off;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /privacy.html { try_files $uri =404; }
    location = /terms.html { try_files $uri =404; }
    location / { return 404; }
}
