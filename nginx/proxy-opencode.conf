# Security boundary for the two local root-origin OpenCode gateways. Do not
# forward authentication, client identity, or proxy-chain headers from the
# browser to OpenCode/ttyd. The CLI identity is injected by gateway.conf only
# after browser-controlled values are cleared; the health endpoint receives a
# separate, non-secret internal identity.
proxy_set_header Authorization "";
proxy_set_header Proxy-Authorization "";
proxy_set_header X-Ingenium-Authenticated-User "";
proxy_set_header X-Client-Identity "";
proxy_set_header X-Authenticated-User "";
proxy_set_header X-Auth-Request-User "";
proxy_set_header X-User "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Server "";
proxy_set_header X-Forwarded-Scheme "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header X-Forwarded-Uri "";
proxy_set_header X-Forwarded-Path "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-User "";
proxy_set_header X-Forwarded-Email "";
proxy_set_header X-Forwarded-Preferred-Username "";
proxy_set_header X-Forwarded-Client-Cert "";
proxy_set_header X-Real-IP "";
proxy_set_header X-Remote-User "";
proxy_set_header Forwarded "";
proxy_set_header X-Original-URL "";
proxy_set_header X-Rewrite-URL "";

# The dashboard's supported loopback origins are the only allowed embedding
# origins. CSP host-source grammar has no IPv6 literal form: Chromium rejects
# `http://[::1]:3000` and CSP3 only guarantees 127.0.0.1 as an IP source.
# Direct IPv6 dashboard navigation is canonicalized to `localhost` by
# gateway.conf. `localhost` remains valid when it resolves over IPv6,
# preserving the trusted dashboard origin without emitting an invalid directive.
# Remove upstream framing policy so this exact, gateway-owned policy is authoritative;
# X-Frame-Options cannot express this cross-origin relationship and would block
# the iframe.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
add_header Content-Security-Policy "frame-ancestors http://localhost:3000 http://127.0.0.1:3000" always;
