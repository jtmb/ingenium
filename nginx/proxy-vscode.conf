# code-server is reachable only through http://vscode.localhost:3000/. Clear
# browser-controlled credentials, forwarding, identity, and rewrite headers; the
# gateway never injects an Ingenium API bearer token into this administrator-grade
# terminal service. The gateway validates WebSocket Origin before this include
# forwards the caller-provided value to the loopback upstream.
proxy_set_header Authorization "";
proxy_set_header Proxy-Authorization "";
proxy_set_header X-Ingenium-Authenticated-User "";
proxy_set_header X-Client-Identity "";
proxy_set_header X-Authenticated-User "";
proxy_set_header X-Auth-Request-User "";
proxy_set_header X-User "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Server "";
proxy_set_header X-Forwarded-Scheme "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header X-Forwarded-Uri "";
proxy_set_header X-Forwarded-Path "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-User "";
proxy_set_header X-Forwarded-Email "";
proxy_set_header X-Forwarded-Preferred-Username "";
proxy_set_header X-Forwarded-Client-Cert "";
proxy_set_header X-Real-IP "";
proxy_set_header X-Remote-User "";
proxy_set_header Forwarded "";
proxy_set_header X-Original-URL "";
proxy_set_header X-Rewrite-URL "";

# code-server emits a nonce-bearing workbench CSP that must stay intact. Nginx
# sends this second policy only to constrain embedding; X-Frame-Options cannot
# express the trusted dashboard origins and would otherwise conflict. 'self'
# permits code-server's same-origin worker-host iframe without admitting other
# parents.
proxy_hide_header X-Frame-Options;
add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:3000 http://127.0.0.1:3000" always;
