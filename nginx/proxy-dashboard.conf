# The dashboard must not receive browser-supplied authorization or proxy
# identity headers. Nginx clears them before proxying and overwrites the three
# external-origin fields consumed by Next's dashboard CSRF guard. They are
# deliberately scalar values (not forwarded chains): Host and port remain
# separate so malformed, multi-valued, or credential-bearing metadata fails
# closed in the dashboard proxy.
proxy_set_header Host $host;
proxy_set_header Authorization "";
proxy_set_header Proxy-Authorization "";
proxy_set_header X-Ingenium-Audience "";
proxy_set_header X-Ingenium-Private-Network "";
proxy_set_header X-Ingenium-Runtime-Gateway "";
proxy_set_header X-Ingenium-Workspace "";
proxy_set_header X-Ingenium-Launcher-Worktree "";
proxy_set_header X-Ingenium-Authenticated-User "";
proxy_set_header X-Client-Identity "";
proxy_set_header X-Authenticated-User "";
proxy_set_header X-Auth-Request-User "";
proxy_set_header X-User "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Forwarded-Server $host;
proxy_set_header X-Forwarded-Scheme $scheme;
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header X-Forwarded-Uri "";
proxy_set_header X-Forwarded-Path "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-User "";
proxy_set_header X-Forwarded-Email "";
proxy_set_header X-Forwarded-Preferred-Username "";
proxy_set_header X-Forwarded-Client-Cert "";
proxy_set_header X-Remote-User "";
proxy_set_header Forwarded "";
proxy_set_header X-Original-URL "";
proxy_set_header X-Rewrite-URL "";
