# Shared transport behavior for the dashboard and dedicated OpenCode origins.
# Request identity headers are set by each server block so the authenticated
# gateways can discard client-supplied identity and forwarding headers.
# Root-origin routing is mandatory: OpenCode serves root-relative assets.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_intercept_errors off;
add_header X-Accel-Buffering no always;
