# Shared transport behavior for the dashboard and dedicated OpenCode origins.
# Route-specific includes own their identity policy: they clear named caller
# headers or inject the fixed local identity required by ttyd.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# OpenCode/ttyd streams need immediate bidirectional flow, so request and
# response buffering and caching stay off. One-hour idle windows keep quiet
# interactive sessions alive while upstream applications retain their own limits.
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_intercept_errors off;
add_header X-Accel-Buffering no always;
