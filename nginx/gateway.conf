worker_processes auto;
pid /run/ingenium-gateway/nginx.pid;
# Nginx runs as appuser and must reopen this file itself. Supervisor exposes
# the same ephemeral file as the gateway's stdout log for service-log queries.
error_log /run/ingenium-gateway/nginx-error.log warn;
lock_file /run/ingenium-gateway/nginx.lock;

# Each browser request can also occupy an upstream socket. 512 leaves room for
# local browser traffic while bounding the per-worker connection footprint.
events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;
    client_body_temp_path /run/ingenium-gateway/client_body;
    proxy_temp_path /run/ingenium-gateway/proxy;
    fastcgi_temp_path /run/ingenium-gateway/fastcgi;
    uwsgi_temp_path /run/ingenium-gateway/uwsgi;
    scgi_temp_path /run/ingenium-gateway/scgi;

    # Do not persist request lines: paths and query strings can contain secrets.
    # Supervisor sends stderr to Docker's bounded local logging driver.
    access_log off;

    # Keep each 30r/s gateway surface in its own bucket: dashboard prefetches
    # would otherwise consume the OpenCode startup burst. A 60-request burst
    # tolerates page startup without increasing the sustained rate; assets and
    # upgrades use an empty key so they do not compete with dynamic requests.
    map $http_upgrade $opencode_upgrade_rate_limit_key {
        default $binary_remote_addr;
        ~.+     "";
    }

    map $uri $opencode_request_limit_key {
        default $opencode_upgrade_rate_limit_key;
        ~^/(?:assets/|_next/|@vite/|node_modules/\.vite/) "";
    }

    # Keep code-server's workbench load and WebSocket upgrade budget independent
    # from OpenCode and dashboard traffic.
    map $http_upgrade $vscode_upgrade_rate_limit_key {
        default $binary_remote_addr;
        ~.+     "";
    }

    map $uri $vscode_request_limit_key {
        default $vscode_upgrade_rate_limit_key;
        ~^/(?:_static/|static/|stable/) "";
    }

    # Only WebSocket upgrade requests need an Origin gate. Normal workbench
    # documents and assets can legitimately omit Origin and pass unchanged.
    map $http_upgrade $vscode_upgrade_request {
        default 1;
        ""      0;
    }

    map "$vscode_upgrade_request:$http_origin" $vscode_reject_upgrade {
        default                              1;
        ~^0:                                 0;
        "1:http://vscode.localhost:3000"    0;
    }

    # CSP cannot express an IPv6 literal frame ancestor. Canonicalize direct
    # IPv6 loopback dashboard navigation to localhost before the iframe loads;
    # localhost can still resolve to ::1 while retaining a valid CSP origin.
    map $host $dashboard_ipv6_loopback {
        default 0;
        "::1" 1;
        "[::1]" 1;
    }

    # ttyd's --check-origin compares the WebSocket Origin to the upstream Host.
    # The public CLI root is intentionally distinct from the dashboard root, so
    # proxying $host would reject otherwise trusted local dashboard requests.
    # Keep the original Origin, but derive the upstream Host only from the
    # explicit local-origin allowlist. cli.localhost is the isolated document
    # origin of ttyd itself; localhost and 127.0.0.1 are the dashboard origins
    # already trusted by the gateway frame policy.
    map $http_origin $ttyd_websocket_upstream_host {
        default "";
        "http://localhost:3000" "localhost:3000";
        "http://127.0.0.1:3000" "127.0.0.1:3000";
        "http://cli.localhost:3000" "cli.localhost:3000";
    }

    # Sixteen concurrent requests leave headroom for normal parallel browser
    # fetches and streams while preventing one client from monopolizing workers.
    limit_req_zone $binary_remote_addr zone=dashboard_request:10m rate=30r/s;
    limit_req_zone $opencode_request_limit_key zone=opencode_request:10m rate=30r/s;
    limit_req_zone $vscode_request_limit_key zone=vscode_request:10m rate=30r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=gateway_conn:10m;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    # Bound reusable loopback sockets: dashboard and OpenCode need parallel
    # browser traffic, while the callback-only API upstream needs a smaller pool.
    upstream ingenium_dashboard {
        server 127.0.0.1:3001;
        keepalive 16;
    }

    upstream ingenium_api {
        server 127.0.0.1:4096;
        keepalive 4;
    }

    upstream opencode_web {
        server 127.0.0.1:4098;
        keepalive 16;
    }

    upstream opencode_cli {
        server 127.0.0.1:4099;
        keepalive 16;
    }

    upstream vscode {
        server 127.0.0.1:4100;
        keepalive 16;
    }

    # Windows-to-WSL forwarding can preserve a host name other than localhost.
    # Make the default virtual host the local dashboard gateway instead of
    # closing the connection before the browser can use same-origin API
    # requests. Dedicated OpenCode roots below still select their own upstreams.
    server {
        listen 3000 default_server;
        listen [::]:3000 default_server;
        server_name _;

        if ($dashboard_ipv6_loopback) {
            return 308 http://localhost:3000$request_uri;
        }

        # Next serves content-hashed build chunks only under this path. Keep
        # these immutable assets out of the dashboard request bucket while the
        # trailing slash keeps data, RSC, API, traversal, and sibling paths in
        # the dynamic location below.
        location ^~ /_next/static/ {
            limit_conn gateway_conn 16;
            proxy_pass http://ingenium_dashboard;
            include /app/nginx/proxy-common.conf;
            include /app/nginx/proxy-dashboard.conf;
        }

        location / {
            limit_req zone=dashboard_request burst=60 nodelay;
            limit_conn gateway_conn 16;
            proxy_pass http://ingenium_dashboard;
            include /app/nginx/proxy-common.conf;
            include /app/nginx/proxy-dashboard.conf;
        }
    }

    # OAuth providers require a fixed local callback port. This listener is a
    # deliberately tiny public surface: only the exact GET callback path can
    # reach Express; every other path is rejected locally.
    server {
        listen 1455 default_server;
        server_name _;
        access_log off;

        location = /auth/callback {
            # OAuth redirects are GET-only. Do not permit a provider or local
            # client to turn the callback listener into a generic API tunnel.
            if ($request_method != GET) {
                return 405;
            }
            limit_except GET {
                deny all;
            }

            proxy_pass http://ingenium_api;
            include /app/nginx/proxy-common.conf;
            include /app/nginx/proxy-oauth-callback.conf;
        }

        location / {
            return 404;
        }
    }

    include /run/ingenium-gateway/runtime-aliases.conf;
}
