[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:opencode-web]
command=/app/scripts/start-runtime-opencode-web.sh
directory=/workspace
autorestart=unexpected
startsecs=5
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ttyd-opencode]
command=/app/scripts/start-ttyd.sh
directory=/workspace
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:vscode]
command=/app/scripts/start-vscode.sh
directory=/workspace
autorestart=unexpected
startsecs=5
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
priority=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
