services:
  ingenium:
    build:
      context: .
      # NEXT_PUBLIC_* values are embedded into the Next.js dashboard during
      # image creation. They are deliberately non-secret gateway origins.
      args:
        NEXT_PUBLIC_OPENCODE_WEB_URL: "${NEXT_PUBLIC_OPENCODE_WEB_URL:-http://opencode.localhost:3000/}"
        NEXT_PUBLIC_OPENCODE_CLI_URL: "${NEXT_PUBLIC_OPENCODE_CLI_URL:-http://cli.localhost:3000/}"
        # Compose cannot evaluate Git commands. The deployment command must
        # supply the checkout SHA explicitly so the image remains traceable.
        IMAGE_REVISION: "${IMAGE_REVISION:?IMAGE_REVISION must be set to the current Git commit SHA}"
        IMAGE_SOURCE: "${IMAGE_SOURCE:-https://github.com/jtmb/ingenium}"
    restart: unless-stopped
    ports:
      # WSL must bind the gateway beyond its Linux-only loopback interface so
      # Windows localhost forwarding can reach it. This is a local-only trust
      # boundary; do not use the plain-HTTP gateway for LAN or remote access.
      - "3000:3000"
      # Keep the bearer API boundary loopback-scoped for host MCP clients.
      # Browser traffic must use the same-origin dashboard proxy instead.
      - "127.0.0.1:4097:4097"
      # Nginx binds this port and exposes only GET /auth/callback.
      - "127.0.0.1:1455:1455"
    environment:
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is required}
      # The entrypoint accepts one bootstrap source, copies it to a mode-0600
      # runtime file, then removes the plaintext variable before supervisor.
      - INGENIUM_API_TOKEN=${INGENIUM_API_TOKEN:-}
      - INGENIUM_API_TOKEN_FILE=${INGENIUM_API_TOKEN_FILE:-}
      - INGENIUM_CORE_DB_PATH=/app/.ingenium/data
      # Forward an optional operator override; blank values fall back safely.
      - INGENIUM_BACKUPS_DIR=${INGENIUM_BACKUPS_DIR:-}
      - INGENIUM_API_PORT=4096
      - INGENIUM_GLOBAL_CONFIG_PATH=/home/appuser/.config/opencode
      # Exact browser origins accepted by both the dashboard proxy and API
      # CSRF/CORS layer. Do not add wildcards, paths, or credentials.
      - DASHBOARD_ALLOWED_ORIGINS=${DASHBOARD_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - MS_OAUTH_CLIENT_ID=${MS_OAUTH_CLIENT_ID:-}
      - MS_OAUTH_CLIENT_SECRET=${MS_OAUTH_CLIENT_SECRET:-}
      - INGENIUM_EMAIL_ENCRYPTION_KEY=${INGENIUM_EMAIL_ENCRYPTION_KEY:?INGENIUM_EMAIL_ENCRYPTION_KEY (64 hex chars) is required}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI:-http://localhost:3000/mail/oauth/callback}
    volumes:
      - ingenium-data:/app/.ingenium
      - opencode-config:/home/appuser/.config
      - opencode-data:/home/appuser/.local
      - ./opencode.json:/app/opencode.json:ro
      # Compose must be started from a WSL/Linux shell with HOME set. The
      # complete host repository root is the workspace contract; do not replace
      # it with a checkout-specific path.
      - "${HOME:?HOME must be set for the /workspace bind mount}/repos:/workspace"
      - ${HOME:-~}/.local/share/opencode:/var/opencode:rw
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      thread-guard:
        condition: service_healthy
    networks:
      - default
      - thread-frontend

  thread:
    build:
      context: .
      target: thread-runtime
    restart: unless-stopped
    # Authentication is disabled only because this service has no host port and
    # is attached solely to the internal Thread network below.
    environment:
      - THREAD_AUTH_ENABLED=false
      - THREAD_HOST=0.0.0.0
      - THREAD_PORT=5000
      - THREAD_DB_PATH=/app/data/thread.db
      - THREAD_GIT_BASE=/app/data/git
    volumes:
      - thread_data:/app/data
    networks:
      - thread-backend

  thread-guard:
    build:
      context: .
      target: thread-guard-runtime
    restart: unless-stopped
    # The image also selects appuser, but make the non-root deployment contract
    # explicit at Compose level so a later image change cannot silently widen it.
    user: "1000:1000"
    read_only: true
    environment:
      - THREAD_GUARD_HOST=0.0.0.0
      - THREAD_GUARD_PORT=8081
      - THREAD_GUARD_TEMP_DIRECTORY=/run/thread-guard
    tmpfs:
      - /run/thread-guard:uid=1000,gid=1000,mode=0700
    expose:
      - "8081"
    depends_on:
      thread:
        condition: service_healthy
    networks:
      - thread-backend
      - thread-frontend

volumes:
  ingenium-data:
  opencode-config:
  opencode-data:
  thread_data:

networks:
  thread-backend:
    internal: true
  thread-frontend:
    internal: true
